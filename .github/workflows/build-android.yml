name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEV_KEYSTORE_PROPS: /tmp/jev-release.properties

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager path: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -8 || true
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Generate throwaway keystore for release signing
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/jev-release.jks \
            -alias jev -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jevbuild123 -keypass jevbuild123 \
            -dname "CN=Jev CI Build, OU=CI, O=Jev, L=NA, ST=NA, C=CN"
          printf 'storeFile=%s\nstorePassword=jevbuild123\nkeyAlias=jev\nkeyPassword=jevbuild123\n' \
            /tmp/jev-release.jks > /tmp/jev-release.properties
          cat /tmp/jev-release.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show output files
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: jev-android-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
